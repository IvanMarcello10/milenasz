<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin — Privacy</title>
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="login-screen">
  <div class="login-box">
    <h1>🔒 Admin</h1>
    <p>Acesso restrito</p>
    <input type="text" id="login-user" class="input" placeholder="Usuário" value="ivan" />
    <input type="password" id="login-password" class="input" placeholder="Senha" onkeydown="if(event.key==='Enter')doLogin()" />
    <button class="btn-primary" onclick="doLogin()">Entrar</button>
    <p id="login-error" class="error"></p>
  </div>
</div>

<!-- PAINEL -->
<div id="admin-panel" style="display:none;">
  <header class="admin-header">
    <h1>⚙️ Painel</h1>
    <div class="admin-actions">
      <a href="/" target="_blank" class="btn-secondary">👁️ Ver site</a>
      <button class="btn-secondary" onclick="logout()">Sair</button>
    </div>
  </header>

  <div class="admin-content">

    <section class="card">
      <h2>⚡ Site</h2>
      <label class="checkbox-label">
        <input type="checkbox" data-path="site_ativo" /> Site ativo
      </label>
      <label class="full mt-2">Mensagem de manutenção
        <input class="input" data-path="mensagem_manutencao" />
      </label>
    </section>

    <section class="card">
      <h2>👤 Perfil</h2>
      <div class="grid">
        <label>Nome <input class="input" data-path="profile.name" /></label>
        <label>@Username <input class="input" data-path="profile.username" /></label>
        <label>Localização <input class="input" data-path="profile.location" /></label>
        <label>Letra do Avatar <input class="input" data-path="profile.avatarLetter" maxlength="2" /></label>
        <label class="full">URL do Avatar <input class="input" data-path="profile.avatarUrl" /></label>
        <label class="full">URL do Banner <input class="input" data-path="profile.bannerUrl" /></label>
        <label class="full">Bio <textarea class="input" rows="4" data-path="profile.bio"></textarea></label>
      </div>
    </section>

    <section class="card">
      <h2>💰 Oferta</h2>
      <div class="grid">
        <label>Título <input class="input" data-path="offer.title" /></label>
        <label>Texto do botão <input class="input" data-path="offer.buttonText" /></label>
        <label class="full">Descrição <textarea class="input" rows="2" data-path="offer.description"></textarea></label>
        <label>Preço <input class="input" type="number" step="0.01" data-path="offer.price" /></label>
        <label>Preço original <input class="input" type="number" step="0.01" data-path="offer.originalPrice" /></label>
        <label class="full">Selo <input class="input" data-path="offer.discountBadge" /></label>
      </div>
    </section>

    <section class="card">
      <h2>📦 Planos</h2>
      <div id="plans-container"></div>
      <button class="btn-secondary mt-2" onclick="addPlan()">+ Adicionar</button>
    </section>

    <section class="card">
      <h2>🎥 Vídeo & Stats</h2>
      <div class="grid">
        <label class="full">URL do vídeo <input class="input" data-path="video.url" /></label>
        <label>Imagens <input class="input" type="number" data-path="stats.images" /></label>
        <label>Vídeos <input class="input" type="number" data-path="stats.videos" /></label>
        <label>Curtidas <input class="input" data-path="stats.likes" /></label>
      </div>
    </section>

    <div class="save-bar">
      <button class="btn-primary big" onclick="saveContent()">💾 Salvar (commit)</button>
      <span id="save-status" class="save-status"></span>
    </div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
